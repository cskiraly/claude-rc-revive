[project]
name = "claude-rc-revive"
dynamic = ["version"]
description = "Turn Claude Code's Remote Control back on in tmux sessions after the claude.ai account changes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "Csaba Kiraly"}]
license = {text = "MIT"}
keywords = ["claude", "claude-code", "remote-control", "tmux", "cswap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cskiraly/claude-rc-revive"
Issues = "https://github.com/cskiraly/claude-rc-revive/issues"

[project.scripts]
rc-revive = "claude_rc_revive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claude_rc_revive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_rc_revive"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
